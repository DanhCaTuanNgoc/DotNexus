# ==============================================================================
# DotNexus Enterprise Inbound Reverse Proxy Configuration (Nginx)
# Track: Node Operations & Tooling — Portaldot Hacker House 2026
# Target Network: Portaldot Network V3.0 (Dual-VM: Substrate WASM + EVM pallet-revive)
# Reference: NODE_INFRASTRUCTURE_AUDIT_REPORT.md (Sections 5 & 6)
# ==============================================================================
# Architecture:
# Public Internet / DApps
#       │
#       ▼
# [ Nginx Socket Firewall & Buffer Guard ]
#    ├── Port 8545 ──> Hardened EVM JSON-RPC (256KB cap, rate limiting) ──> Internal :8546
#    ├── Port 9944 ──> Hardened Substrate WS RPC (WASM Consensus)       ──> Internal :9943
#    ├── Port 5050 ──> DotNexus Engine REST & Prometheus /metrics       ──> Internal :5050
#    └── Port 443  ──> DotNexus Visual Control Center (React 19 UI)
# ==============================================================================

# Rate Limiting Zones (Token Bucket Policy)
limit_req_zone $binary_remote_addr zone=rpc_evm_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rpc_ws_zone:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn_zone:10m;

# Upstream Backend Nodes
upstream internal_evm_rpc {
    server 127.0.0.1:8546 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream internal_substrate_ws {
    server 127.0.0.1:9943 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dotnexus_engine_api {
    server 127.0.0.1:5050 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 1. Hardened EVM JSON-RPC Listener (Port 8545)
# Protects Frontier / pallet-revive from OOM crashes and JSON-RPC Batch Bombs
# ------------------------------------------------------------------------------
server {
    listen 8545;
    listen [::]:8545;
    server_name rpc.validator.portaldot.local;

    # Hard Ceiling: 256KB Payload Cap (Mitigates State-Bloat & Recursive Calldata)
    client_max_body_size 256k;
    client_body_buffer_size 256k;

    # Anti-Slowloris Timeouts
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 5s;

    # Anti-DDoS Rate Limiting
    limit_req zone=rpc_evm_zone burst=20 nodelay;
    limit_conn addr_conn_zone 15;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DotNexus-Shield "ARMED-INLINE-PROXY" always;

    location / {
        # Restrict HTTP Verbs to POST / OPTIONS only for EVM JSON-RPC
        limit_except POST OPTIONS {
            deny all;
        }

        # Forwarding to Internal Engine Proxy Gateway
        proxy_pass http://internal_evm_rpc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy Buffering & Timeout Limits
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
        proxy_buffering off;
    }
}

# ------------------------------------------------------------------------------
# 2. Hardened Substrate WebSocket RPC Listener (Port 9944)
# Protects WASM Consensus, Session Keys & State Trie from Unbounded Queries
# ------------------------------------------------------------------------------
server {
    listen 9944;
    listen [::]:9944;
    server_name ws.validator.portaldot.local;

    client_max_body_size 256k;

    limit_req zone=rpc_ws_zone burst=30 nodelay;
    limit_conn addr_conn_zone 25;

    location / {
        proxy_pass http://internal_substrate_ws;
        proxy_http_version 1.1;

        # WebSocket Upgrade Handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket Long-Lived Session Timeout
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ------------------------------------------------------------------------------
# 3. DotNexus Control Plane Gateway & Prometheus Metrics (Port 5050)
# ------------------------------------------------------------------------------
server {
    listen 5050;
    listen [::]:5050;
    server_name ops.validator.portaldot.local;

    client_max_body_size 512k;

    # Prometheus Metrics Scraping Endpoint (OpenMetrics standard)
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;      # Internal VPC / NOC Subnet
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://dotnexus_engine_api/metrics;
        proxy_http_version 1.1;
    }

    # REST Control Plane APIs
    location / {
        proxy_pass http://dotnexus_engine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
