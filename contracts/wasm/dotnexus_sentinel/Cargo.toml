[package]
name = "dotnexus_sentinel"
version = "0.1.0"
authors = ["DotNexus Team <ops@dotnexus.io>"]
edition = "2021"
description = "DotNexus On-Chain Validator Heartbeat Sentinel (ink! v5 for Substrate pallet-contracts)"

[dependencies]
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"], optional = true }

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]
ink-as-dependency = []
